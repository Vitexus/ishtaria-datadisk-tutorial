# Zeměměřič
surveyor.greet: Jsem Zeměměřič. Tento vrch ukazuje, co umí příběhový disk umístit.
surveyor.ask_locate: Jak se sem ten vrch dostal?
surveyor.ask_patch: Čím je zvláštní zem pod nohama?
surveyor.ask_crowd: Proč tu lidé chodí?
surveyor.ask_planet: A co skutečná planeta a dané tělo?
surveyor.leave: Rozhlédnu se
surveyor.understand: Rozumím
surveyor.seen: Už jsem to viděl
surveyor.locate: Disk naměřil 800 metrů na severovýchod od vesnice a vzal nejbližší vyhovující zem. Mohyla je zaměřený bod, takže stojí přesně 40 metrů východně ode mě. Její kameny jsou model přibalený k disku a dá se k nim dojít.
surveyor.patch: Obdélník pod vašima nohama je krajinná záplata. Výšky se měří od místa, kde toto místo stojí, takže stejná záplata sedne na kterýkoli svět. Borovice, keře, jeleni, lišky a ovce jsou vlastní seznam tohoto místa, ne obvyklá skladba krajiny.
surveyor.crowd: Obcházím čtverec a na každém rohu se zastavím. Učedník se toulá. Starší a dítě ve vesnici sdílejí jeden pozdrav a chodí každý svou rychlostí. Postava může také stát vyšší než model, jako já.
surveyor.planet: Disk může přibalit celou planetu jako výškovou mapu a masku vody a místa připnout zeměpisnou šířkou a délkou. Může také zvolit tělo, kterým hrajete, jak je vysoké, jak moc bolí pád, a model místo vzhledu z tvůrce postavy. Tento tutoriál nechává planetu procedurální a vzhled na vás, takže se o svět může dělit s takovým diskem. Nápěv u obalu a venku na pláních je vlastní hudba disku.

