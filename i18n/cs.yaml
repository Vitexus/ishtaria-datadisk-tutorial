# Alara Dialogue
alara.greet: Vítejte v Ishtarii! Jsem Alara, vaše první učitelka.
alara.ask_controls: Jak se pohybuji a interaguji?
alara.ask_movement: Jak funguje pohyb?
alara.leave: Budu prozkoumávat sám
alara.controls: Použijte WASD pro pohyb, myš pro rozhlédnutí a E pro interakci.
alara.understand: Rozumím
alara.movement: Chůze pomalu spotřebovává vytrvalost. Běh ji spotřebovává rychleji. Odpočin si pro obnovu.

