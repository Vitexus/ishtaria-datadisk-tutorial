quest.tutorial.meet_tutors: Seznámíte se s každým učitelem a naučte se jejich lekce
quest.tutorial.complete: Tutoriál dokončen! Jste připraveni prozkoumávat.
quest.tutorial_disk_features: Lekce příběhového disku
