# Surveyor
surveyor.greet: I am Surveyor. This rise is here to show what a story disk can place.
surveyor.ask_locate: How did this rise get here?
surveyor.ask_patch: What is special about the ground?
surveyor.ask_crowd: Why are people walking?
surveyor.ask_planet: What about a real planet and a fixed body?
surveyor.leave: I will look around
surveyor.understand: I understand
surveyor.seen: I have seen it
surveyor.locate: The disk measured 800 metres northeast of the village and took the nearest fitting ground. The cairn is a surveyed point, so it stands exactly 40 metres east of me. Its stones are a model shipped with the disk, and you can walk up to them.
surveyor.patch: The rectangle under your feet is a landscape patch. Its heights are measured from the spot where this place stands, so the same patch can sit on any world. The pines, bushes, deer, foxes and sheep here are this place's own list, not the usual mix of the land.
surveyor.crowd: I patrol a square and pause at each corner. The apprentice wanders. The elder and the child in the village share one greeting and walk at their own speeds. A character can also stand taller than the model, as I do.
surveyor.planet: A disk may ship a whole planet as a height map and a water mask, and pin places by latitude and longitude. It may also choose the body you play, how tall it is, how hard a fall hurts, and a model in place of the creator's look. This tutorial leaves the planet procedural and lets you choose your character, so it can share a world with such a disk. The tune at the cover and out on the plains is the disk's own music.

